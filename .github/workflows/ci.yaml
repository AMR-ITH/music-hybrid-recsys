          hybrid_recommender.py \
          utility_required_hybridrec.py \
          data_cleaning.py \
          requirements.txt


    - name: Upload ZIP to S3
      if: success()
      run: |
        aws s3 cp hybrid_rec_sys.zip s3://hybridrecsysdeployementbucket/hybrid_rec_sys.zip